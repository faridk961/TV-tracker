name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_TMDB_KEY: ${{ secrets.TMDB_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check TMDB key secret
        run: |
          if [ -z "$EXPO_PUBLIC_TMDB_KEY" ]; then
            echo "Add a repository secret named TMDB_KEY (Settings > Secrets and variables > Actions), then re-run."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          npx expo install --fix

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (arm64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: video-follow-up-apk
          path: android/app/build/outputs/apk/release/*.apk
